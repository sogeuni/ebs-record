name: Recording

on:
  workflow_dispatch:
    inputs:
      program_name:
        description: "Program Name"
        required: true
        default: "Test Program"
      duration:
        description: "Duration (seconds)"
        required: true
        default: "10"
      scheduled_time:
        description: "Scheduled Start Time (KST HH:MM or HH:MM:SS)"
        required: false
        default: ""

jobs:
  record:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Run Recorder & Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          STREAM_URL: ${{ secrets.STREAM_URL }}
        run: |
          # Ensure clean state
          find . -type d -name "__pycache__" -exec rm -rf {} +

          # Run recorder with Secret Stream URL
          python3 src/recorder.py "$STREAM_URL" ${{ inputs.duration }} "${{ inputs.program_name }}" --scheduled_time "${{ inputs.scheduled_time }}"
