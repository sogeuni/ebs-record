name: Recording

on:
  workflow_dispatch:
    inputs:
      program_name:
        description: "Program Name (e.g. fm)"
        required: true
        default: "fm"
      stream_url:
        description: "Stream URL"
        required: true
        default: "http://ebsonair.ebs.co.kr/fmradiofamilypc/familypc1m/playlist.m3u8"
      duration:
        description: "Duration (seconds)"
        required: true
        default: "10"

jobs:
  record:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository (main branch)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Create Config
        # Create config.json dynamically setting base_url for GitHub Pages
        run: |
          echo '{
            "base_url": "https://sogeuni.github.io/record-stream"
          }' > config.json

      - name: Run Recorder
        run: |
          python3 src/recorder.py "${{ inputs.stream_url }}" ${{ inputs.duration }} "${{ inputs.program_name }}"

      - name: Commit and Push to Main
        run: |
          # 1. Define Variables
          PROGRAM_NAME="${{ inputs.program_name }}"
          # Replace spaces with hyphens for folder name
          SAFE_PROGRAM_NAME="${PROGRAM_NAME// /-}"

          echo "Processing for: $SAFE_PROGRAM_NAME"

          # 2. Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 3. Add files (recorder.py writes to recordings/safe-name/)
          # Force add if .gitignore prevents it, though recordings/ should be visible now
          git add recordings/$SAFE_PROGRAM_NAME/*.m4a
          git add recordings/$SAFE_PROGRAM_NAME/feed.xml || true 

          # 4. Commit and Push
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add recording: $SAFE_PROGRAM_NAME ($(date +'%Y-%m-%d %H:%M'))"
            
            # Clean up config.json to avoid rebase error (unstaged changes)
            git checkout -- config.json || true
            
            # Pull with rebase to handle concurrent pushes
            git pull --rebase origin main
            git push origin main
          fi
