name: Recording

on:
  workflow_dispatch:
    inputs:
      program_name:
        description: "Program Name (e.g. fm)"
        required: true
        default: "fm"
      stream_url:
        description: "Stream URL"
        required: true
        default: "http://ebsonair.ebs.co.kr/fmradiofamilypc/familypc1m/playlist.m3u8"
      duration:
        description: "Duration (seconds)"
        required: true
        default: "10"

jobs:
  record:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository (main branch)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Run Recorder
        run: |
          python3 src/recorder.py "${{ inputs.stream_url }}" ${{ inputs.duration }} "${{ inputs.program_name }}"

      - name: Deploy to Publish Branch
        run: |
          # 1. Setup Identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Preserve Recordings
          # We want to keep the history of the publish branch, so we fetch it.
          # But simpler: use a dedicated action or manual orphan reset?
          # Let's use manual fetch and merge to keep history.

          git fetch origin publish:publish || git checkout --orphan publish

          # 3. Move new recordings to a safe place
          mkdir -p /tmp/new_recordings
          cp -r recordings/* /tmp/new_recordings/

          # 3.5 CLEANUP: Remove local changes to allow checkout
          # The generated files prevent switching branches if they conflict.
          git reset --hard
          git clean -fd

          # 4. Switch to publish branch
          git checkout publish

          # 5. Restore recordings (Keep existing ones, overwrite new ones)
          # We check out publish branch which now should hold programs at root
          # We copy new recordings to root
          cp -r /tmp/new_recordings/* .

          # Optional: Remove old 'recordings' dir if it exists to clean up
          if [ -d "recordings" ]; then
            git rm -r recordings || true
            rm -rf recordings
          fi

          # 6. Commit and Push
          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add recording: ${{ inputs.program_name }} ($(date +'%Y-%m-%d %H:%M'))"
            git push origin publish
          fi
