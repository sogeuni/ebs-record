name: Recording

on:
  workflow_dispatch:
    inputs:
      time_slot:
        description: "Scheduled Time Slot (UTC HH:MM) - Auto-filled by Worker"
        required: false
        default: ""
      program_name:
        description: "Program Name (Manual Override)"
        required: false
        default: ""
      duration:
        description: "Duration (seconds)"
        required: false
        default: "10"
      scheduled_time:
        description: "Scheduled Start Time (KST HH:MM or HH:MM:SS)"
        required: false
        default: ""

jobs:
  record:
    # Pin the runner to an OS with Python 3.9 builds available.
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Run Recorder & Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          STREAM_URL: ${{ secrets.STREAM_URL }}
        run: |
          # Ensure clean state
          find . -type d -name "__pycache__" -exec rm -rf {} +

          # Run recorder with Schedule Support
          python3 src/recorder.py --time_slot "${{ inputs.time_slot }}" --program_name "${{ inputs.program_name }}" --duration ${{ inputs.duration }} --scheduled_time "${{ inputs.scheduled_time }}"
