name = "ebs-record"
main = "workers/trigger.js"
compatibility_date = "2023-01-01"

[triggers]
# Consolidated Crons (Max 5 allowed)
# 1. 19:59, 20:59, 21:59 (05:00, 06:00, 07:00 KST)
# 2. 21:19, 22:19 (06:20, 07:20 KST)
# 3. 21:39, 22:39 (06:40, 07:40 KST)
crons = ["59 19-21 * * SUN-FRI", "19 21-22 * * SUN-FRI", "39 21-22 * * SUN-FRI"]

[vars]
# GITHUB_TOKEN은 별도 설정 필요
# Points to the 'publish' branch
RAW_URL = "https://raw.githubusercontent.com/sogeuni/ebs-record/publish"

# Common Stream URL (EBS FM)
COMMON_STREAM_URL = "http://ebsonair.ebs.co.kr/fmradiofamilypc/familypc1m/playlist.m3u8"

# Production Schedule (KST)
# Key format: "HH:mm" (UTC)
# Programs start 30 seconds after broadcast time.
# Duration: 18m 30s (1110s).

