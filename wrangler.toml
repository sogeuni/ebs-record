name = "ebs-record"
main = "workers/trigger.js"
compatibility_date = "2023-01-01"

[triggers]
crons = ["19 22 * * SUN-FRI", "39 22 * * SUN-FRI", "39 20 * * SUN-FRI"]

[vars]
# GITHUB_TOKEN은 별도 설정 필요
# RAW_URL: GitHub Raw Content Base URL (Private Repo Token Access)
# Points to the 'publish' branch
RAW_URL = "https://raw.githubusercontent.com/sogeuni/ebs-record/publish"

# Common Stream URL (EBS FM)
COMMON_STREAM_URL = "http://ebsonair.ebs.co.kr/fmradiofamilypc/familypc1m/playlist.m3u8"

# Production Schedule (KST Mon-Sat)
# 1. Easy English: 07:20:30 KST -> 22:20:30 UTC (Trigger at 22:19)
# 2. Power English: 07:40:30 KST -> 22:40:30 UTC (Trigger at 22:39)
# 3. Basic Japanese: 05:40:30 KST -> 20:40:30 UTC (Trigger at 20:39)
# Days: Mon-Sat KST = Sun-Fri UTC (0-5)

SCHEDULE_JSON = '''
{
  "19 22 * * SUN-FRI": {
    "program_name": "easy_english",
    "scheduled_time": "07:20:30",
    "duration": 1110
  },
  "39 22 * * SUN-FRI": {
    "program_name": "power_english",
    "scheduled_time": "07:40:30",
    "duration": 1110
  },
  "39 20 * * SUN-FRI": {
    "program_name": "basic_japanese",
    "scheduled_time": "05:40:30",
    "duration": 1110
  }
}
'''

[observability]
[observability.logs]
enabled = true
invocation_logs = true
