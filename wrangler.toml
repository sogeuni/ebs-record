name = "ebs-record"
main = "workers/trigger.js"
compatibility_date = "2023-01-01"

[triggers]
# 여기에 Cron 식을 등록해야 이벤트가 발생합니다.
# Test Schedule: Trigger 1 minute early (e.g., minute 4, 9, 14...)
# Execution will wait until minute 5, 10, 15... (00 seconds)
crons = ["4/5 * * * *"]

[vars]
# GITHUB_TOKEN은 별도 설정 필요
# RAW_URL: GitHub Raw Content Base URL (Private Repo Token Access)
# Points to the 'publish' branch
RAW_URL = "https://raw.githubusercontent.com/sogeuni/ebs-record/publish"

# SCHEDULE_JSON 변수에 일정과 프로그램 정보를 JSON 문자열로 정의합니다.
# Test Schedule: Every 5 minutes, 60 seconds recording
SCHEDULE_JSON = '''
{
  "4/5 * * * *": {
    "program_name": "test",
    "stream_url": "http://ebsonair.ebs.co.kr/fmradiofamilypc/familypc1m/playlist.m3u8",
    "duration": 60
  }
}
'''

[observability]
[observability.logs]
enabled = true
invocation_logs = true
